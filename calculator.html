<!DOCTYPE <!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>Calculator</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id=""instruction-box>
            <button id="show-instruction">Instruction</button>
            <div id="instruction-container">
                <div id="instruction-value">
                    <h2> Hello</h2>
                    <p>This is user manual for calculator!</p>
                    <div id="leave-instruction">X</div>
                </div>
            </div>
        </div>
        <div id="calculator-box">
            <div  id="screen">
                <p id="calculation">Placeholder</p>
            </div>
            <span class="separator"></span>
            <div id="buttons-container">
                <div id="CE" class="numbers">CE</div>
                <div id="del" class="numbers operations">del</div>
                <div id="%" class="numbers operations">%</div>
                <div></div>

                <div id="7" class="numbers">7</div>
                <div id="8" class="numbers">8</div>
                <div id="9" class="numbers">9</div>
                <div id="/" class="numbers operations">/</div>

                <div id="4" class="numbers">4</div>
                <div id="5" class="numbers">5</div>
                <div id="6" class="numbers">6</div>
                <div id="*" class=" numbers operations">*</div>

                <div id="1" class="numbers">1</div>
                <div id="2" class="numbers">2</div>
                <div id="3" class="numbers">3</div>
                <div id="-" class="numbers operations">-</div>
                
                <div id="0" class="numbers">0</div>
                <div id="." class="numbers">.</div>
                <div id="=" class="numbers equals">=</div>
                <div id="+" class="numbers operations">+</div>

                <div id="space" class="numbers">space</div>


            </div>
        </div>
        <img id="joke">
        <audio id="audio">
            <source id="joke-source" type="audio/mpeg">
        </audio>
        
        <script src="calculator_fun.js"></script>
    </body>
</html>
